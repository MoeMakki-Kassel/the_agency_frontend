<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>TheAgencyJo | Book Concert Tickets &amp; Live Events in MENA</title>
    <meta
      name="description"
      content="Book curated concerts and premium live experiences across the MENA region. Secure tickets in seconds with instant QR e-tickets."
    />
    <meta
      name="keywords"
      content="TheAgencyJo, concert tickets, live events, MENA, Jordan, concerts, book tickets, live music"
    />
    <meta name="author" content="TheAgencyJo" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- hreflang: language toggled in-app (EN / AR) on the same URLs -->
    <link rel="alternate" hreflang="en" href="__SITE_URL__/" />
    <link rel="alternate" hreflang="ar" href="__SITE_URL__/" />
    <link rel="alternate" hreflang="x-default" href="__SITE_URL__/" />

    <!-- Static favicon = the bundled TheAgencyJo logo from public/. Replaced at
         runtime by bootstrapFavicon.ts once settings.logo_url is populated. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TheAgencyJo" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="TheAgencyJo | Book Concert Tickets &amp; Live Events in MENA" />
    <meta
      property="og:description"
      content="Book curated concerts and premium live experiences across the MENA region. Secure tickets in seconds with instant QR e-tickets."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:alt" content="TheAgencyJo — live event ticketing" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TheAgencyJo | Book Concert Tickets &amp; Live Events in MENA" />
    <meta
      name="twitter:description"
      content="Book curated concerts and premium live experiences across the MENA region. Secure tickets in seconds."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="TheAgencyJo — live event ticketing" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "TheAgencyJo",
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/og-image.png",
            "email": "hello@theagencyjo.com",
            "areaServed": {
              "@type": "Place",
              "name": "Middle East and North Africa"
            }
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "url": "__SITE_URL__/",
            "name": "TheAgencyJo",
            "description": "Curated concerts and premium live experiences across the MENA region.",
            "publisher": { "@id": "__SITE_URL__/#organization" },
            "inLanguage": ["en", "ar"]
          }
        ]
      }
    </script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
